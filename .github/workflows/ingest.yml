name: Ingest m150 sites
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ingest.yml'

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download m150 zip from Drive
        run: |
          curl -L --retry 3 --max-time 900 "https://drive.usercontent.google.com/download?id=1dsw-yVagxDAoJe8eGT_O0VO-l11ghOIz&export=download&confirm=t" -o /tmp/m150.zip
          ls -lh /tmp/m150.zip
          if ! head -c 2 /tmp/m150.zip | grep -q "PK"; then
            echo "ERROR: Downloaded file is not a zip"
            head -c 500 /tmp/m150.zip
            exit 1
          fi
          echo "Valid zip confirmed"

      - name: Extract sites
        run: |
          cd /tmp
          unzip -q m150.zip
          ls -d /tmp/m150/

      - name: Commit sites
        run: |
          for d in /tmp/m150/*/; do
            slug=$(basename "$d")
            if [ "$slug" != "crew_csv" ] && [ -f "$d/index.html" ]; then
              mkdir -p "$slug"
              cp "$d/index.html" "$slug/"
            fi
          done
          echo "Copied $(ls -d */ | wc -l) directories"

      - name: Push
        run: |
          git config user.name "Not Ai"
          git config user.email "iamnottaiii@gmail.com"
          git add .
          git commit -m "Ingest m150: $(ls -d */ | wc -l) sites" || echo "Nothing to commit"
          git push
